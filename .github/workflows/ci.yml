# =============================================================================
# EphemeralShield — CI Workflow
# =============================================================================
# Runs on every push and pull request.
# Phase 1: Lint, typecheck, and unit tests only.
# Phase 5: Full pipeline with integration, security, and resilience tests.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Type Check, Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Pin to SHA for supply chain security (§5.2)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835c3c7f4a7d0f3eb44f7ba6e # v5.3.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (Ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v --tb=short

# =============================================================================
# EphemeralShield — Alembic Configuration
# =============================================================================
# Alembic manages database schema migrations for the control-plane (broker-db).
#
# WHY Alembic over SQLAlchemy create_all()?
#   create_all() only creates missing tables — it can't modify existing ones.
#   In production, you need ALTER TABLE, add columns, add indexes, etc.
#   Alembic tracks each change as a versioned migration file, so every
#   environment runs the exact same schema changes in the exact same order.
#
# WHY not auto-generate migrations?
#   Auto-generation is useful but we manually review every migration because
#   schema changes to the audit ledger and lease tables are security-critical.
# =============================================================================

[alembic]
# Path to the migration scripts directory
script_location = migrations

# Template for new migration filenames
# We prefix with a sequence number for readability, but Alembic uses the
# revision hash for actual dependency ordering.
file_template = %%(rev)s_%%(slug)s

# The database URL is loaded from settings.py via env.py, not hardcoded here.
# This placeholder is overridden at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Timezone for migration timestamps — always UTC for consistency
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
# Set to INFO to see generated SQL during migrations (useful for review)
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
